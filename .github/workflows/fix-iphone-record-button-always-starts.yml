name: Fix iPhone record button

on:
  push:
    branches:
      - fix/iphone-record-button-always-starts
    paths:
      - .github/workflows/fix-iphone-record-button-always-starts.yml
      - tools/fix_iphone_record_button.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-record-button-always-starts
      - run: python tools/fix_iphone_record_button.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('iphone-field.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/iphone.js').write_text(js)
          PY
          node --check /tmp/iphone.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add iphone-field.html
          git commit -m "Allow iPhone field measurement to start reliably"
          git push
