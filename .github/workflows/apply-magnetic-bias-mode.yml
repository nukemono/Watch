name: Apply magnetic bias estimation mode

on:
  push:
    branches: [feature/magnetic-bias-estimation-mode]
    paths:
      - .github/workflows/apply-magnetic-bias-mode.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/magnetic-bias-estimation-mode
      - name: Patch iphone-field.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('iphone-field.html')
          s = p.read_text()

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'anchor not found: {label}')
              s = s.replace(old, new, 1)

          once('<title>太陽ウォッチ iPhone 屋外統合検証 v2</title>', '<title>太陽ウォッチ iPhone 屋外統合検証 v3</title>', 'title')
          once('<h1 style="margin-top:12px">☀️ iPhone 屋外統合検証 v2</h1>', '<h1 style="margin-top:12px">☀️ iPhone 屋外統合検証 v3</h1>', 'heading')
          once('''<div class="muted">センサー検証の生データと、太陽ウォッチMVPの時刻推定結果を<strong>同じ10秒セッション</strong>で保存します。iPhone向けの180°ジャンプ補正・parity recovery・50ms固定サンプリング・IndexedDB保存に加え、<strong>測定前の安定待ちと測定中の品質監視</strong>を統合しています。</div>''', '''<div class="muted">センサー検証の生データと、太陽ウォッチMVPの時刻推定結果を<strong>同じ10秒セッション</strong>で保存します。iPhone向けの180°ジャンプ補正・parity recovery・50ms固定サンプリング・IndexedDB保存・品質監視に加え、<strong>複数観測から共通の磁気方位バイアスを推定するモード</strong>を切り替えられます。</div>''', 'intro')
          once('''.notice{border:1px solid #ead274;background:#fff7dd;border-radius:10px;padding:9px;font-size:.8rem;line-height:1.5}.notice.badNotice{border-color:#e0aaaa;background:#fff0f0;color:#8d2020}.mono''', '''.notice{border:1px solid #ead274;background:#fff7dd;border-radius:10px;padding:9px;font-size:.8rem;line-height:1.5}.notice.badNotice{border-color:#e0aaaa;background:#fff0f0;color:#8d2020}.modeBox{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafafa}.switchLine{display:flex;align-items:center;gap:9px;font-size:.9rem;cursor:pointer}.switchLine input{width:auto;transform:scale(1.25);accent-color:var(--ok)}.mono''', 'mode css')

          once('''    </div>\n    <button id="startBtn" class="green">カメラ・センサー・GPSを開始</button>''', '''    </div>\n    <div class="modeBox">\n      <label class="switchLine"><input id="biasMode" type="checkbox"><strong>磁気バイアス推定モード</strong></label>\n      <div id="biasModeHelp" class="muted">OFF：従来どおり1回の観測から推定します。ON：同じ端末名・条件ID・近い地点の複数観測から、共通の磁気方位バイアスと時刻を同時推定します。</div>\n      <div id="biasModeStatus" class="muted mono">モード: OFF</div>\n    </div>\n    <button id="startBtn" class="green">カメラ・センサー・GPSを開始</button>''', 'mode ui')

          once('''      <div class="metric"><div class="label">測定品質</div><div id="qualityValue" class="value big">--</div></div>\n      <div class="metric"><div class="label">推定時刻</div><div id="estimatedTime" class="value big">--</div></div>''', '''      <div class="metric"><div class="label">測定品質</div><div id="qualityValue" class="value big">--</div></div>\n      <div class="metric"><div class="label">推定モード</div><div id="estimateMode" class="value">--</div></div>\n      <div class="metric"><div class="label">推定時刻</div><div id="estimatedTime" class="value big">--</div></div>\n      <div class="metric"><div class="label">推定磁気バイアス</div><div id="biasValue" class="value big">--</div></div>''', 'result mode metrics')
          once('''      <div class="metric"><div class="label">安定サンプル率</div><div id="readyRatio" class="value">--</div></div>\n      <div class="metric"><div class="label">角度残差</div><div id="residual" class="value">--</div></div>''', '''      <div class="metric"><div class="label">安定サンプル率</div><div id="readyRatio" class="value">--</div></div>\n      <div class="metric"><div class="label">バイアス推定 観測数 / 時間幅</div><div id="biasObservationCount" class="value">--</div></div>\n      <div class="metric"><div class="label">バイアス推定 時計補正量</div><div id="biasClockOffset" class="value">--</div></div>\n      <div class="metric"><div class="label">角度残差</div><div id="residual" class="value">--</div></div>''', 'result bias detail metrics')

          once('''  const FINAL_HEADING_SD_MAX = 3, FINAL_ELEV_SD_MAX = 3, MIN_SAMPLE_COUNT = 160, MIN_READY_RATIO = 0.8, MAX_GPS_ACCURACY = 50;\n  const DB_NAME = 'solarwatch_iphone_field_v1', STORE = 'sessions';''', '''  const FINAL_HEADING_SD_MAX = 3, FINAL_ELEV_SD_MAX = 3, MIN_SAMPLE_COUNT = 160, MIN_READY_RATIO = 0.8, MAX_GPS_ACCURACY = 50;\n  const BIAS_MIN_OBS = 2, BIAS_RECOMMENDED_OBS = 3, BIAS_MIN_SPAN_MIN = 5, BIAS_RECOMMENDED_SPAN_MIN = 15;\n  const BIAS_GROUP_RADIUS_M = 100, BIAS_MAX_OBS = 8, BIAS_MAX_RESIDUAL_RMS = 6;\n  const BIAS_SEARCH_MIN = -720, BIAS_SEARCH_MAX = 720;\n  const INITIAL_BIAS_MODE = (()=>{ try{return localStorage.getItem('solarwatch_magnetic_bias_mode')==='1';}catch(_){return false;} })();\n  const DB_NAME = 'solarwatch_iphone_field_v1', STORE = 'sessions';''', 'bias constants')
          once('''    camera3d:null, primaryHeading:null, cameraElevation:null,\n    sampleTimer:null, recording:false, samples:[], recordStartPerf:0,''', '''    camera3d:null, primaryHeading:null, cameraElevation:null, biasMode:INITIAL_BIAS_MODE,\n    sampleTimer:null, recording:false, samples:[], recordStartPerf:0,''', 'bias state')

          bias_helpers = r'''\n  function signedCircularMean(values){\n    const st=circularStats(values.map(norm));\n    return finite(st.mean)?cd(st.mean,0):null;\n  }\n  function observationTimeFromSamples(samples){\n    const ts=(samples||[]).map(x=>Date.parse(x.sample_time_iso)).filter(finite).sort((a,b)=>a-b);\n    return new Date(ts.length?((ts[0]+ts[ts.length-1])/2):Date.now());\n  }\n  function sessionObservationDate(session){\n    const d=new Date(session.observation_time_iso||session.created_at);\n    return Number.isNaN(d.getTime())?null:d;\n  }\n  function sameLocalDay(a,b){\n    return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();\n  }\n  function distanceMeters(a,b){\n    if(!a||!b||![a.lat,a.lon,b.lat,b.lon].every(finite))return Infinity;\n    const p1=a.lat*rad,p2=b.lat*rad,dp=(b.lat-a.lat)*rad,dl=(b.lon-a.lon)*rad;\n    const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;\n    return 6371000*2*Math.atan2(Math.sqrt(h),Math.sqrt(Math.max(0,1-h)));\n  }\n  function biasGroupSessions(sessions,current){\n    const currentDate=sessionObservationDate(current);\n    const dedup=new Map();\n    for(const x of sessions){\n      if(!x||x.magnetic_bias_mode!==true||x.quality?.valid===false)continue;\n      if(x.device_label!==current.device_label||x.condition_id!==current.condition_id)continue;\n      const d=sessionObservationDate(x);\n      if(!sameLocalDay(d,currentDate))continue;\n      if(distanceMeters(x.location,current.location)>BIAS_GROUP_RADIUS_M)continue;\n      if(!finite(x.summary?.heading_mean_deg)||!finite(x.summary?.elevation_mean_deg))continue;\n      dedup.set(x.session_id,x);\n    }\n    const all=[...dedup.values()].sort((a,b)=>sessionObservationDate(a)-sessionObservationDate(b));\n    if(all.length<=BIAS_MAX_OBS)return all;\n    const picked=[];\n    for(let i=0;i<BIAS_MAX_OBS;i++)picked.push(all[Math.round(i*(all.length-1)/(BIAS_MAX_OBS-1))]);\n    return [...new Map(picked.map(x=>[x.session_id,x])).values()];\n  }\n  function evaluateBiasOffset(obs,offsetSec){\n    const positions=[];\n    const rawBias=[];\n    for(const o of obs){\n      const t=new Date(o.time.getTime()+offsetSec*1000);\n      const sp=sunPosition(t,o.location.lat,o.location.lon);\n      if(sp.elevation<-8)return null;\n      positions.push({time:t,sun:sp});\n      rawBias.push(cd(o.heading,sp.azimuth));\n    }\n    const bias=signedCircularMean(rawBias);\n    if(!finite(bias))return null;\n    const distances=[],azErrors=[],elErrors=[];\n    for(let i=0;i<obs.length;i++){\n      const corrected=norm(obs[i].heading-bias);\n      const sp=positions[i].sun;\n      distances.push(angularDistance(corrected,obs[i].elevation,sp.azimuth,sp.elevation));\n      azErrors.push(cd(corrected,sp.azimuth));\n      elErrors.push(obs[i].elevation-sp.elevation);\n    }\n    const rms=a=>Math.sqrt(a.reduce((q,v)=>q+v*v,0)/a.length);\n    return {offsetSec,bias,score:rms(distances),azimuthRms:rms(azErrors),elevationRms:rms(elErrors),positions};\n  }\n  function estimateMagneticBias(sessions,current){\n    const grouped=biasGroupSessions(sessions,current);\n    const obs=grouped.map(s=>({\n      id:s.session_id,time:sessionObservationDate(s),location:s.location,\n      heading:s.summary.heading_mean_deg,elevation:s.summary.elevation_mean_deg\n    })).filter(o=>o.time&&finite(o.heading)&&finite(o.elevation));\n    const spanMin=obs.length>1?(obs[obs.length-1].time-obs[0].time)/60000:0;\n    if(obs.length<BIAS_MIN_OBS)return {status:'pending',observation_count:obs.length,observation_span_min:spanMin,needed:BIAS_MIN_OBS-obs.length};\n    if(spanMin<BIAS_MIN_SPAN_MIN)return {status:'pending_span',observation_count:obs.length,observation_span_min:spanMin,needed_span_min:BIAS_MIN_SPAN_MIN-spanMin};\n    let best=null;\n    for(let minute=BIAS_SEARCH_MIN;minute<=BIAS_SEARCH_MAX;minute++){\n      const e=evaluateBiasOffset(obs,minute*60);\n      if(e&&(!best||e.score<best.score))best=e;\n    }\n    if(!best)return {status:'failed',observation_count:obs.length,observation_span_min:spanMin};\n    const coarse=best.offsetSec;\n    for(let sec=coarse-90;sec<=coarse+90;sec++){\n      const e=evaluateBiasOffset(obs,sec);\n      if(e&&e.score<best.score)best=e;\n    }\n    const currentIndex=obs.findIndex(o=>o.id===current.session_id);\n    const idx=currentIndex>=0?currentIndex:obs.length-1;\n    const cp=best.positions[idx];\n    const confidence=best.score<=BIAS_MAX_RESIDUAL_RMS?(obs.length>=BIAS_RECOMMENDED_OBS&&spanMin>=BIAS_RECOMMENDED_SPAN_MIN?'good':'provisional'):'low';\n    return {\n      status:'estimated',confidence,observation_count:obs.length,observation_span_min:spanMin,\n      magnetic_bias_deg:best.bias,clock_offset_min:best.offsetSec/60,residual_rms_deg:best.score,\n      azimuth_rms_deg:best.azimuthRms,elevation_rms_deg:best.elevationRms,\n      current_estimated_time_iso:cp.time.toISOString(),\n      current_predicted_sun_azimuth_deg:cp.sun.azimuth,current_predicted_sun_elevation_deg:cp.sun.elevation,\n      current_corrected_heading_deg:norm(current.summary.heading_mean_deg-best.bias),\n      session_ids:obs.map(o=>o.id)\n    };\n  }\n  async function refreshBiasModeStatus(){\n    const box=$('biasModeStatus');\n    if(!box)return;\n    if(!state.biasMode){ box.textContent='モード: OFF（1回観測）'; return; }\n    if(!state.location){ box.textContent='モード: ON / GPS取得後に同条件の観測数を表示'; return; }\n    try{\n      const pseudo={session_id:'__current__',magnetic_bias_mode:true,quality:{valid:true},device_label:$('deviceLabel').value||'iPhone',condition_id:$('conditionId').value||'I1',location:state.location,observation_time_iso:new Date().toISOString(),summary:{heading_mean_deg:0,elevation_mean_deg:0}};\n      const ss=await getSessions();\n      const count=biasGroupSessions(ss,pseudo).filter(x=>x.session_id!=='__current__').length;\n      box.textContent=`モード: ON / 同条件の保存済み有効観測 ${count}件。最低2回・5分以上、推奨3回・15分以上の時間幅。`;\n    }catch(_){ box.textContent='モード: ON / 複数観測を蓄積してください'; }\n  }\n  function updateBiasModeUi(){\n    $('biasMode').checked=state.biasMode;\n    $('recordBtn').textContent=state.biasMode?'10秒測定 ＋ 磁気バイアス推定':'10秒測定 ＋ 時刻推定';\n    refreshBiasModeStatus();\n  }\n'''
          once('''  function meanSd(values){\n    const a=values.filter(finite);\n    if(!a.length) return {mean:null,sd:null};\n    const mean=a.reduce((x,y)=>x+y,0)/a.length;\n    const sd=Math.sqrt(a.reduce((s,v)=>s+(v-mean)**2,0)/a.length);\n    return {mean,sd};\n  }''', '''  function meanSd(values){\n    const a=values.filter(finite);\n    if(!a.length) return {mean:null,sd:null};\n    const mean=a.reduce((x,y)=>x+y,0)/a.length;\n    const sd=Math.sqrt(a.reduce((s,v)=>s+(v-mean)**2,0)/a.length);\n    return {mean,sd};\n  }''' + bias_helpers, 'bias helper insertion')

          once('''    $('recordBtn').disabled=!usable || state.recording;\n    $('gateText').textContent=!state.location?'GPS待機中':!gpsOk?`GPS精度 ${state.location.accuracy.toFixed(0)}m：50m以下を待っています`:stab.held?'測定できます。太陽を中央に保って開始してください。':'安定性が1.5秒継続すると測定できます。';''', '''    $('recordBtn').disabled=!usable || state.recording;\n    $('recordBtn').textContent=state.biasMode?'10秒測定 ＋ 磁気バイアス推定':'10秒測定 ＋ 時刻推定';\n    $('gateText').textContent=!state.location?'GPS待機中':!gpsOk?`GPS精度 ${state.location.accuracy.toFixed(0)}m：50m以下を待っています`:stab.held?(state.biasMode?'測定できます。複数回は同じ端末名・条件IDで記録してください。':'測定できます。太陽を中央に保って開始してください。'):'安定性が1.5秒継続すると測定できます。';''', 'render mode button')
          once('''      setStatus('gpsStatus','GPS: '+state.location.accuracy.toFixed(0)+'m',state.location.accuracy<=30?'ok':'warn');\n      render();''', '''      setStatus('gpsStatus','GPS: '+state.location.accuracy.toFixed(0)+'m',state.location.accuracy<=30?'ok':'warn');\n      render();\n      refreshBiasModeStatus();''', 'gps bias status')

          once('''      created_at:session.created_at,measurement_valid:q.valid!==false,measurement_invalid_reason:q.reason||'',measurement_ready_ratio:q.ready_ratio??null,measurement_quality_sample_count:q.sample_count??null,...sample,''', '''      created_at:session.created_at,observation_time_iso:session.observation_time_iso??null,magnetic_bias_mode:session.magnetic_bias_mode===true,\n      measurement_valid:q.valid!==false,measurement_invalid_reason:q.reason||'',measurement_ready_ratio:q.ready_ratio??null,measurement_quality_sample_count:q.sample_count??null,...sample,''', 'csv base bias fields')
          once('''      mvp_angular_residual_deg:r.angular_residual_deg??null,\n      actual_sun_azimuth_deg:a.azimuth??null,''', '''      mvp_angular_residual_deg:r.angular_residual_deg??null,\n      estimation_method:r.estimation_method??(session.magnetic_bias_mode?'magnetic_bias_multi_observation':'single_observation'),\n      bias_estimation_status:session.bias_estimation?.status??null,\n      bias_estimation_confidence:session.bias_estimation?.confidence??null,\n      bias_observation_count:session.bias_estimation?.observation_count??null,\n      bias_observation_span_min:session.bias_estimation?.observation_span_min??null,\n      estimated_magnetic_bias_deg:session.bias_estimation?.magnetic_bias_deg??null,\n      bias_clock_offset_min:session.bias_estimation?.clock_offset_min??null,\n      bias_residual_rms_deg:session.bias_estimation?.residual_rms_deg??null,\n      bias_azimuth_rms_deg:session.bias_estimation?.azimuth_rms_deg??null,\n      bias_elevation_rms_deg:session.bias_estimation?.elevation_rms_deg??null,\n      bias_corrected_observed_azimuth_deg:session.bias_estimation?.current_corrected_heading_deg??null,\n      actual_sun_azimuth_deg:a.azimuth??null,''', 'csv bias estimates')

          record_block = r'''  async function record(){\n    if(state.recording) return;\n    const stab=updateStability();\n    const gpsOk=state.location && finite(state.location.accuracy) && state.location.accuracy<=MAX_GPS_ACCURACY;\n    if(!stab.held||!gpsOk){ alert('安定性が「測定可」かつGPS精度50m以下になってから開始してください。'); return; }\n    state.recording=true; state.samples=[]; state.recordStartPerf=performance.now();\n    state.recordUnstableSince=null; state.recordAbortReason=null; state.finishInProgress=false;\n    $('biasMode').disabled=true;\n    $('recordBtn').disabled=true; $('recordingBox').classList.remove('hidden'); $('resultCard').classList.add('hidden'); $('bar').style.width='0%';\n    let index=0;\n    state.sampleTimer=setInterval(()=>{\n      if(state.finishInProgress)return;\n      const elapsed=performance.now()-state.recordStartPerf;\n      const sample=snapshotSample(index++);\n      state.samples.push(sample);\n      const q=sampleQuality(sample);\n      if(q.hard){ state.recordAbortReason=q.reason; finishRecord(true); return; }\n      if(!q.ok){\n        if(state.recordUnstableSince===null)state.recordUnstableSince=performance.now();\n        if(performance.now()-state.recordUnstableSince>=RECORD_UNSTABLE_GRACE_MS){ state.recordAbortReason=q.reason; finishRecord(true); return; }\n      }else state.recordUnstableSince=null;\n      $('bar').style.width=Math.min(100,elapsed/RECORD_MS*100)+'%';\n      $('recordingText').textContent=(elapsed/1000).toFixed(1)+' / 10.0 秒　'+state.samples.length+' samples';\n      if(elapsed>=RECORD_MS) finishRecord(false);\n    },SAMPLE_MS);\n  }\n\n  async function finishRecord(aborted=false){\n    if(state.finishInProgress)return;\n    state.finishInProgress=true;\n    if(state.sampleTimer){ clearInterval(state.sampleTimer); state.sampleTimer=null; }\n    state.recording=false;\n    const observationTime=observationTimeFromSamples(state.samples);\n    const headings=state.samples.map(s=>s.ios_heading_corrected_deg).filter(finite);\n    const elevations=state.samples.map(s=>s.camera3d_elevation_deg).filter(finite);\n    const hs=circularStats(headings), es=meanSd(elevations);\n    const loc=state.location;\n    const readyCount=state.samples.filter(s=>s.readiness_ok).length;\n    const readyRatio=state.samples.length?readyCount/state.samples.length:0;\n    const reasons=[];\n    if(aborted)reasons.push(state.recordAbortReason||'測定中に端末が不安定になりました');\n    if(state.samples.length<MIN_SAMPLE_COUNT)reasons.push(`サンプル不足 ${state.samples.length}/${MIN_SAMPLE_COUNT}`);\n    if(!finite(hs.sd)||hs.sd>FINAL_HEADING_SD_MAX)reasons.push(`方位SD ${finite(hs.sd)?hs.sd.toFixed(1):'--'}°`);\n    if(!finite(es.sd)||es.sd>FINAL_ELEV_SD_MAX)reasons.push(`高度SD ${finite(es.sd)?es.sd.toFixed(1):'--'}°`);\n    if(readyRatio<MIN_READY_RATIO)reasons.push(`安定サンプル率 ${(readyRatio*100).toFixed(0)}%`);\n    if(!loc||!finite(loc.accuracy)||loc.accuracy>MAX_GPS_ACCURACY)reasons.push(`GPS精度 ${loc&&finite(loc.accuracy)?loc.accuracy.toFixed(0):'--'}m`);\n    const valid=reasons.length===0;\n    const actualSun=loc?sunPosition(observationTime,loc.lat,loc.lon):null;\n    const sessionId=`${$('deviceLabel').value||'iPhone'}_${$('conditionId').value||'I1'}_${new Date().toISOString().replace(/[:.]/g,'-')}`;\n    const baseSession={\n      session_id:sessionId,created_at:new Date().toISOString(),observation_time_iso:observationTime.toISOString(),\n      magnetic_bias_mode:state.biasMode,device_label:$('deviceLabel').value||'iPhone',condition_id:$('conditionId').value||'I1',\n      location:loc,quality:{valid,reason:reasons.join(' / '),ready_ratio:readyRatio,sample_count:state.samples.length},\n      summary:{heading_mean_deg:hs.mean,heading_sd_deg:hs.sd,elevation_mean_deg:es.mean,elevation_sd_deg:es.sd,sample_count:state.samples.length},\n      samples:state.samples\n    };\n    let result=null,biasEstimation=null;\n    if(valid&&loc&&finite(hs.mean)&&finite(es.mean)){\n      if(state.biasMode){\n        const existing=await getSessions();\n        biasEstimation=estimateMagneticBias([...existing,baseSession],baseSession);\n        if(biasEstimation.status==='estimated'&&biasEstimation.confidence!=='low'){\n          const estTime=new Date(biasEstimation.current_estimated_time_iso);\n          result={\n            estimated_time_iso:estTime.toISOString(),actual_time_iso:observationTime.toISOString(),\n            time_error_min:signedMinuteError(estTime,observationTime),\n            predicted_sun_azimuth_deg:biasEstimation.current_predicted_sun_azimuth_deg,\n            predicted_sun_elevation_deg:biasEstimation.current_predicted_sun_elevation_deg,\n            angular_residual_deg:biasEstimation.residual_rms_deg,estimation_method:'magnetic_bias_multi_observation',\n            magnetic_bias_deg:biasEstimation.magnetic_bias_deg,observation_count:biasEstimation.observation_count\n          };\n        }\n      }else{\n        const est=estimateTime(hs.mean,es.mean,observationTime,loc.lat,loc.lon);\n        if(est)result={\n          estimated_time_iso:est.time.toISOString(),actual_time_iso:observationTime.toISOString(),\n          time_error_min:signedMinuteError(est.time,observationTime),\n          predicted_sun_azimuth_deg:est.sun.azimuth,predicted_sun_elevation_deg:est.sun.elevation,\n          angular_residual_deg:est.dist,estimation_method:'single_observation'\n        };\n      }\n    }\n    const validation=(actualSun&&finite(hs.mean)&&finite(es.mean))?{\n      azimuth_error_deg:cd(hs.mean,actualSun.azimuth),\n      elevation_error_deg:es.mean-actualSun.elevation\n    }:null;\n    const session={...baseSession,result,bias_estimation:biasEstimation,actual_sun:actualSun,sensor_validation:validation};\n    state.latestSession=session;\n    try{ await saveSession(session); }catch(e){ alert('保存エラー: '+e.message); }\n    showResult(session); await renderHistory(); await refreshBiasModeStatus();\n    $('recordingBox').classList.add('hidden');\n    $('biasMode').disabled=false;\n    state.finishInProgress=false;\n    render();\n  }'''
          s, n = re.subn(r'  async function record\(\)\{.*?\n  \}\n\n  async function finishRecord\(aborted=false\)\{.*?\n  \}', record_block, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('record/finish block not found')

          show_result = r'''  function showResult(s){\n    const r=s.result,v=s.sensor_validation,q=s.quality||{valid:true,reason:'',ready_ratio:null},b=s.bias_estimation;\n    $('resultCard').classList.remove('hidden');\n    $('qualityValue').textContent=q.valid?'有効':'無効';\n    $('qualityValue').style.color=q.valid?'var(--ok)':'var(--bad)';\n    $('estimateMode').textContent=s.magnetic_bias_mode?'磁気バイアス推定':'1回観測';\n    $('estimatedTime').textContent=r?new Date(r.estimated_time_iso).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'--';\n    $('timeError').textContent=r?(r.time_error_min>=0?'+':'')+r.time_error_min.toFixed(1)+'分':'--';\n    $('biasValue').textContent=b&&finite(b.magnetic_bias_deg)?((b.magnetic_bias_deg>=0?'+':'')+b.magnetic_bias_deg.toFixed(1)+'°'):'--';\n    $('biasObservationCount').textContent=b?`${b.observation_count??0}回 / ${finite(b.observation_span_min)?b.observation_span_min.toFixed(1):'--'}分`:'--';\n    $('biasClockOffset').textContent=b&&finite(b.clock_offset_min)?((b.clock_offset_min>=0?'+':'')+b.clock_offset_min.toFixed(1)+'分'):'--';\n    $('obsHeading').textContent=fmt(s.summary.heading_mean_deg);\n    $('obsElevation').textContent=fmt(s.summary.elevation_mean_deg);\n    $('headingSd').textContent=fmt(s.summary.heading_sd_deg);\n    $('elevationSd').textContent=fmt(s.summary.elevation_sd_deg);\n    $('readyRatio').textContent=finite(q.ready_ratio)?(q.ready_ratio*100).toFixed(0)+'%':'--';\n    $('residual').textContent=r?fmt(r.angular_residual_deg):b&&finite(b.residual_rms_deg)?fmt(b.residual_rms_deg):'--';\n    $('resultGps').textContent=s.location?s.location.accuracy.toFixed(1)+' m':'--';\n    $('actualAzError').textContent=v?((v.azimuth_error_deg>=0?'+':'')+v.azimuth_error_deg.toFixed(1)+'°'):'--';\n    $('actualElError').textContent=v?((v.elevation_error_deg>=0?'+':'')+v.elevation_error_deg.toFixed(1)+'°'):'--';\n    $('magneticAssessment').textContent=v?`${magneticClass(v.azimuth_error_deg)} (${v.azimuth_error_deg>=0?'+':''}${v.azimuth_error_deg.toFixed(1)}°)`:'--';\n    const detail=$('resultDetail');\n    detail.classList.toggle('badNotice',!q.valid||(b&&b.confidence==='low'));\n    if(!q.valid){\n      detail.textContent='無効測定として保存しました。理由: '+(q.reason||'品質条件を満たしませんでした')+'。時刻推定には使用しません。';\n    }else if(s.magnetic_bias_mode&&b?.status==='pending'){\n      detail.textContent=`有効な観測として保存しました。磁気バイアス推定にはあと${b.needed}回必要です。同じ端末名・条件ID・ほぼ同じ地点で、時間を空けて再測定してください。`;\n    }else if(s.magnetic_bias_mode&&b?.status==='pending_span'){\n      detail.textContent=`有効な観測は${b.observation_count}回ありますが、時間幅が${b.observation_span_min.toFixed(1)}分です。少なくともあと${b.needed_span_min.toFixed(1)}分空けて再測定してください。`;\n    }else if(s.magnetic_bias_mode&&b?.status==='estimated'&&b.confidence==='low'){\n      detail.textContent=`共通バイアスは${b.magnetic_bias_deg>=0?'+':''}${b.magnetic_bias_deg.toFixed(1)}°と推定されましたが、残差RMS ${b.residual_rms_deg.toFixed(1)}°が大きいため時刻推定には採用していません。磁気の影響が観測ごとに変化している可能性があります。`;\n    }else if(s.magnetic_bias_mode&&b?.status==='estimated'&&r){\n      const correction=-b.magnetic_bias_deg;\n      detail.textContent=`${b.observation_count}回・${b.observation_span_min.toFixed(1)}分の観測から共通磁気バイアス ${b.magnetic_bias_deg>=0?'+':''}${b.magnetic_bias_deg.toFixed(1)}°を推定しました。方位には${correction>=0?'+':''}${correction.toFixed(1)}°の補正を適用。残差RMS ${b.residual_rms_deg.toFixed(1)}°、信頼度 ${b.confidence==='good'?'良好':'暫定'}。実時刻との比較は検証専用です。`;\n    }else if(r){\n      detail.textContent=`推定太陽 方位 ${r.predicted_sun_azimuth_deg.toFixed(1)}° / 高度 ${r.predicted_sun_elevation_deg.toFixed(1)}°。実時刻の太陽 方位 ${s.actual_sun.azimuth.toFixed(1)}° / 高度 ${s.actual_sun.elevation.toFixed(1)}°。磁気影響候補は検証用端末時刻との比較で判定しています。`;\n    }else{\n      detail.textContent='測定は保存されましたが、時刻推定結果を作成できませんでした。';\n    }\n    $('resultCard').scrollIntoView({behavior:'smooth',block:'start'});\n  }'''
          s, n = re.subn(r'  function showResult\(s\)\{.*?\n  \}\n\n  async function renderHistory', show_result + '\n\n  async function renderHistory', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('showResult block not found')

          history = r'''  async function renderHistory(){\n    const ss=await getSessions();\n    if(!ss.length){ $('history').innerHTML='<span class="muted">まだありません。</span>'; return; }\n    $('history').innerHTML=ss.slice(0,12).map(s=>{\n      const r=s.result,q=s.quality||{valid:true,reason:''},b=s.bias_estimation;\n      let resultText;\n      if(!q.valid)resultText='無効: '+(q.reason||'品質不足');\n      else if(r)resultText='推定 '+new Date(r.estimated_time_iso).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' / 誤差 '+r.time_error_min.toFixed(1)+'分';\n      else if(s.magnetic_bias_mode&&b?.status==='pending')resultText=`バイアス推定待ち ${b.observation_count}/${BIAS_MIN_OBS}回`;\n      else if(s.magnetic_bias_mode&&b?.status==='pending_span')resultText=`時間幅待ち ${b.observation_span_min.toFixed(1)}分`;\n      else if(s.magnetic_bias_mode&&b?.confidence==='low')resultText=`バイアス残差大 ${b.residual_rms_deg.toFixed(1)}°`;\n      else resultText='推定待ち';\n      const mode=s.magnetic_bias_mode?'磁気バイアス':'1回';\n      return `<div class="history"><strong>${q.valid?'✅':'⚠️'} ${s.device_label} / ${s.condition_id}</strong><br><span class="muted">${new Date(s.created_at).toLocaleString()} / ${mode} / ${resultText} / n=${s.summary.sample_count}</span></div>`;\n    }).join('');\n  }'''
          s, n = re.subn(r'  async function renderHistory\(\)\{.*?\n  \}', history, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('renderHistory block not found')

          once("  $('startBtn').onclick=startAll;", "  $('biasMode').checked=state.biasMode;\n  $('biasMode').onchange=()=>{ state.biasMode=$('biasMode').checked; try{localStorage.setItem('solarwatch_magnetic_bias_mode',state.biasMode?'1':'0');}catch(_){} updateBiasModeUi(); };\n  $('deviceLabel').addEventListener('change',refreshBiasModeStatus);\n  $('conditionId').addEventListener('change',refreshBiasModeStatus);\n  $('startBtn').onclick=startAll;", 'bias event handlers')
          once('''  renderHistory();\n})();''', '''  updateBiasModeUi();\n  renderHistory().then(refreshBiasModeStatus);\n})();''', 'initial bias ui')

          p.write_text(s)
          PY
      - name: Syntax check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('iphone-field.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/iphone-field.js').write_text(js)
          PY
          node --check /tmp/iphone-field.js
      - name: Basic marker checks
        run: |
          grep -q '磁気バイアス推定モード' iphone-field.html
          grep -q 'estimateMagneticBias' iphone-field.html
          grep -q 'bias_estimation_status' iphone-field.html
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-magnetic-bias-mode.yml
      - name: Commit generated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add iphone-field.html .github/workflows/apply-magnetic-bias-mode.yml
          git commit -m "Add magnetic bias estimation mode"
          git push
