name: Repair magnetic bias patcher

on:
  push:
    branches: [feature/magnetic-bias-estimation-mode]
    paths:
      - .github/workflows/repair-magnetic-bias-patcher.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/magnetic-bias-estimation-mode
      - name: Repair escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-magnetic-bias-mode.yml')
          s = p.read_text()
          s = s.replace("bias_helpers = r'''", "bias_helpers = '''")
          s = s.replace("record_block = r'''", "record_block = '''")
          s = s.replace("show_result = r'''", "show_result = '''")
          s = s.replace("history = r'''", "history = '''")
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/apply-magnetic-bias-mode.yml
          git commit -m "Repair magnetic bias patcher escaping"
          git push
