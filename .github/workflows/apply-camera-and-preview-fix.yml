name: Apply camera and preview fix

on:
  push:
    branches:
      - fix/iphone-camera-controls-and-preview
    paths:
      - .github/workflows/apply-camera-and-preview-fix.yml
      - tools/fix_camera_controls.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-camera-controls-and-preview
      - run: python tools/fix_camera_controls.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('iphone-field.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/iphone.js').write_text(js)
          assert 'video.controls=false' in s
          assert 'pointer-events:none' in s
          assert 'cameraPauseGuard' in s
          w=Path('.github/workflows/pr-preview.yml').read_text()
          assert "if: github.event.action != 'closed'" not in w
          PY
          node --check /tmp/iphone.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add iphone-field.html .github/workflows/pr-preview.yml
          git commit -m "Hide iOS camera controls and fix preview cleanup"
          git push
