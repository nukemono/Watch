name: Apply camera and preview fix

on:
  push:
    branches: [fix/iphone-camera-controls-and-preview]
    paths:
      - .github/workflows/apply-camera-and-preview-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-camera-controls-and-preview
      - name: Patch iPhone camera and PR preview
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('iphone-field.html')
          s=p.read_text()

          old='video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.fallback'
          new='video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-select:none;user-select:none}video::-webkit-media-controls,video::-webkit-media-controls-panel,video::-webkit-media-controls-start-playback-button{display:none!important;-webkit-appearance:none}.fallback'
          if old not in s: raise SystemExit('video css anchor not found')
          s=s.replace(old,new,1)

          old='<video id="video" autoplay muted playsinline></video>'
          new='<video id="video" autoplay muted playsinline disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback" tabindex="-1" aria-hidden="true"></video>'
          if old not in s: raise SystemExit('video element anchor not found')
          s=s.replace(old,new,1)

          old="""  async function startCamera(){
    try{
      state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      $('video').srcObject=state.stream;
      $('fallback').classList.add('hidden');
      setStatus('cameraStatus','カメラ: OK','ok');
    }catch(err){
      $('fallback').textContent='カメラ取得不可: '+err.message;
      setStatus('cameraStatus','カメラ: 失敗','bad');
    }
  }"""
          new="""  async function startCamera(){
    try{
      state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      const video=$('video');
      // iOS Safari の動画プレイヤーUIを完全に無効化し、カメラプレビューとしてだけ使う。
      video.controls=false;
      video.removeAttribute('controls');
      video.autoplay=true;
      video.muted=true;
      video.defaultMuted=true;
      video.playsInline=true;
      video.setAttribute('playsinline','');
      video.setAttribute('webkit-playsinline','');
      if('disablePictureInPicture' in video) video.disablePictureInPicture=true;
      video.srcObject=state.stream;
      if(!video.dataset.cameraPauseGuard){
        video.dataset.cameraPauseGuard='1';
        video.addEventListener('pause',()=>{
          // SafariのUIや誤タップ等でpauseされても、ストリームが生きている限り即復帰する。
          if(state.stream&&state.stream.active) video.play().catch(()=>{});
        });
      }
      await video.play().catch(()=>{});
      for(const track of state.stream.getVideoTracks()){
        track.onended=()=>{
          setStatus('cameraStatus','カメラ: 停止','bad');
          $('fallback').textContent='カメラが停止しました。ページを再読み込みせず「カメラ・センサー・GPSを開始」から再取得してください。';
          $('fallback').classList.remove('hidden');
          $('startBtn').disabled=false;
          $('startBtn').textContent='カメラを再取得';
        };
      }
      $('fallback').classList.add('hidden');
      setStatus('cameraStatus','カメラ: OK','ok');
    }catch(err){
      $('fallback').textContent='カメラ取得不可: '+err.message;
      $('fallback').classList.remove('hidden');
      setStatus('cameraStatus','カメラ: 失敗','bad');
    }
  }"""
          if old not in s: raise SystemExit('startCamera anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('.github/workflows/pr-preview.yml')
          s=p.read_text()
          old="""      - name: Checkout PR branch
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
"""
          new="""      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
"""
          if old not in s: raise SystemExit('preview checkout anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify changes
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('iphone-field.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/iphone.js').write_text(js)
          assert 'video.controls=false' in s
          assert 'pointer-events:none' in s
          assert 'cameraPauseGuard' in s
          w=Path('.github/workflows/pr-preview.yml').read_text()
          assert "if: github.event.action != 'closed'" not in w
          PY
          node --check /tmp/iphone.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add iphone-field.html .github/workflows/pr-preview.yml
          git commit -m "Hide iOS camera controls and fix preview cleanup"
          git push
