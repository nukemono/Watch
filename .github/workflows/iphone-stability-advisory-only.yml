name: iPhone stability advisory only

on:
  push:
    branches:
      - fix/iphone-stability-advisory-only
    paths:
      - .github/workflows/iphone-stability-advisory-only.yml
      - tools/make_stability_advisory.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-stability-advisory-only
      - run: python tools/make_stability_advisory.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('iphone-field.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/iphone.js').write_text(js)
          assert '安定性は参考表示なので' in s
          assert 'stability_advisory_only:true' in s
          assert 'finishRecord(true)' not in s[s.find('state.sampleTimer=setInterval'):s.find('async function finishRecord')]
          PY
          node --check /tmp/iphone.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add iphone-field.html
          git commit -m "Make iPhone stability advisory only"
          git push
