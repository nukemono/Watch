name: Fix iPhone result time display

on:
  push:
    branches:
      - fix/iphone-result-time-display
    paths:
      - .github/workflows/fix-iphone-result-time-display.yml
      - tools/fix_result_display.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-result-time-display
      - run: python tools/fix_result_display.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('iphone-field.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/iphone.js').write_text(js)
          PY
          node --check /tmp/iphone.js
          node --check magnetic-bias-mode.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add iphone-field.html magnetic-bias-mode.js
          git commit -m "Keep estimated time visible in iPhone field results"
          git push
