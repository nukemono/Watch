name: Fix iPhone field elevation and bias toggle

on:
  push:
    branches: [fix/iphone-field-elevation-bias-toggle]
    paths:
      - .github/workflows/fix-iphone-field-elevation-bias-toggle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-field-elevation-bias-toggle
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('iphone-field.html')
          s=p.read_text()
          s=s.replace('<div><div class="label">条件ID</div><input id="conditionId" value="I1"></div>\n    </div>\n    <button id="startBtn" class="green">カメラ・センサー・GPSを開始</button>', '<div><div class="label">条件ID</div><input id="conditionId" value="I1"></div>\n    </div>\n    <div id="biasModeBox" class="notice" style="margin-top:10px">\n      <label style="display:flex;align-items:center;gap:8px;font-weight:800"><input id="biasMode" type="checkbox" style="width:auto;transform:scale(1.25)"> 磁気バイアス推定モード</label>\n      <div id="biasModeStatus" class="muted" style="margin-top:6px">OFF：従来の1回観測推定</div>\n    </div>\n    <button id="startBtn" class="green">カメラ・センサー・GPSを開始</button>',1)
          s=s.replace('<div class="metric"><div class="label">カメラ高度角 / 3D</div><div id="elevation" class="value big">--</div></div>','<div class="metric"><div class="label">端末高度角（水平0°）</div><div id="elevation" class="value big">--</div></div>',1)
          s=s.replace('''  function betaElevation360(){\n    if(!finite(state.b)) return null;\n    return norm(state.b);\n  }''','''  function betaElevation360(){\n    if(!finite(state.b)) return null;\n    return norm(state.b);\n  }\n\n  function phoneElevationFromBeta(){\n    if(!finite(state.b)) return null;\n    return Math.abs(state.b);\n  }''',1)
          s=s.replace('state.cameraElevation=state.camera3d && finite(state.camera3d.elevation) ? state.camera3d.elevation : null;','state.cameraElevation=phoneElevationFromBeta();',1)
          s=s.replace('camera3d_elevation_deg:state.camera3d?.elevation??null,','camera3d_elevation_deg:state.cameraElevation,\n      camera3d_optical_elevation_deg:state.camera3d?.elevation??null,',1)
          p.write_text(s)

          p=Path('magnetic-bias-mode.js')
          s=p.read_text()
          old="""  function injectUi(){\n    if($('biasMode'))return;\n    const conditionCard=document.querySelectorAll('.card')[1],row=conditionCard?.querySelector('.row');\n    if(row){\n      const box=document.createElement('div');box.className='notice';box.style.marginTop='10px';\n      box.innerHTML='<label style=\"display:flex;align-items:center;gap:8px;font-weight:800\"><input id=\"biasMode\" type=\"checkbox\" style=\"width:auto;transform:scale(1.25)\"> 磁気バイアス推定モード</label><div id=\"biasModeStatus\" class=\"muted\" style=\"margin-top:6px\">OFF：従来の1回観測推定</div>';\n      row.insertAdjacentElement('afterend',box);\n    }\n    const grid=$('resultCard')?.querySelector('.grid');\n    if(grid&&!$('biasValue')){\n      const html='<div class=\"metric\"><div class=\"label\">推定モード</div><div id=\"estimateMode\" class=\"value\">--</div></div><div class=\"metric\"><div class=\"label\">推定磁気バイアス</div><div id=\"biasValue\" class=\"value\">--</div></div><div class=\"metric\"><div class=\"label\">バイアス観測数 / 時間幅</div><div id=\"biasObservationCount\" class=\"value\">--</div></div><div class=\"metric\"><div class=\"label\">時計補正量</div><div id=\"biasClockOffset\" class=\"value\">--</div></div>';\n      grid.insertAdjacentHTML('beforeend',html);\n    }\n    const saved=localStorage.getItem('solarwatch_magnetic_bias_mode')==='1';$('biasMode').checked=saved;\n    $('biasMode').addEventListener('change',()=>{localStorage.setItem('solarwatch_magnetic_bias_mode',$('biasMode').checked?'1':'0');refreshStatus();});\n    $('recordBtn').addEventListener('click',()=>{pendingStart=Date.now();processedId=null;});\n  }"""
          new="""  function injectUi(){\n    const conditionCard=document.querySelectorAll('.card')[1],row=conditionCard?.querySelector('.row');\n    if(!$('biasMode')&&row){\n      const box=document.createElement('div');box.className='notice';box.style.marginTop='10px';\n      box.innerHTML='<label style=\"display:flex;align-items:center;gap:8px;font-weight:800\"><input id=\"biasMode\" type=\"checkbox\" style=\"width:auto;transform:scale(1.25)\"> 磁気バイアス推定モード</label><div id=\"biasModeStatus\" class=\"muted\" style=\"margin-top:6px\">OFF：従来の1回観測推定</div>';\n      row.insertAdjacentElement('afterend',box);\n    }\n    const grid=$('resultCard')?.querySelector('.grid');\n    if(grid&&!$('biasValue')){\n      const html='<div class=\"metric\"><div class=\"label\">推定モード</div><div id=\"estimateMode\" class=\"value\">--</div></div><div class=\"metric\"><div class=\"label\">推定磁気バイアス</div><div id=\"biasValue\" class=\"value\">--</div></div><div class=\"metric\"><div class=\"label\">バイアス観測数 / 時間幅</div><div id=\"biasObservationCount\" class=\"value\">--</div></div><div class=\"metric\"><div class=\"label\">時計補正量</div><div id=\"biasClockOffset\" class=\"value\">--</div></div>';\n      grid.insertAdjacentHTML('beforeend',html);\n    }\n    if($('biasMode')&&!$('biasMode').dataset.bound){\n      $('biasMode').checked=false;\n      $('biasMode').dataset.bound='1';\n      $('biasMode').addEventListener('change',refreshStatus);\n    }\n    if($('recordBtn')&&!$('recordBtn').dataset.biasBound){\n      $('recordBtn').dataset.biasBound='1';\n      $('recordBtn').addEventListener('click',()=>{pendingStart=Date.now();processedId=null;});\n    }\n  }"""
          if old not in s:
              raise SystemExit('injectUi anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('iphone-field.html').read_text(); js=s.split('<script>',1)[1].split('</script>',1)[0]; Path('/tmp/iphone.js').write_text(js)
          PY
          node --check /tmp/iphone.js
          node --check magnetic-bias-mode.js
          grep -q '端末高度角（水平0°）' iphone-field.html
          grep -q 'id="biasMode"' iphone-field.html
          grep -q 'camera3d_optical_elevation_deg' iphone-field.html
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add iphone-field.html magnetic-bias-mode.js
          git commit -m "Fix iPhone elevation baseline and bias toggle"
          git push
