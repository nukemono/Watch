<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SolarWatch</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#000;padding:24px;text-align:center;z-index:9999}.bad{color:#ffb3b3}pre{white-space:pre-wrap;word-break:break-word;text-align:left}
</style>
</head>
<body>
<div id="status" class="loading">SolarWatch を準備しています…</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const source=await fetch('iphone-field.html',{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('統合検証版の取得に失敗: '+r.status);
      return r.text();
    });

    const parsed=new DOMParser().parseFromString(source,'text/html');
    const loader=[...parsed.scripts].find(script=>script.textContent.includes('document.open();document.write(html);document.close();'));
    if(!loader) throw new Error('統合検証版の実行処理が見つかりません');

    let code=loader.textContent;
    const terminal='  document.open();document.write(html);document.close();';
    if(!code.includes(terminal)) throw new Error('統合検証版の出力位置が見つかりません');

    const replacement=[
      "  const userReplace=(from,to,label)=>{ if(!html.includes(from)) throw new Error('ユーザー版パッチ対象が見つかりません: '+label); html=html.replace(from,to); };",
      "  userReplace('<body>','<body><div id=\"userBootShield\" class=\"loading\" style=\"position:fixed;inset:0;z-index:9999;background:#000;color:#fff;display:grid;place-items:center;padding:24px;text-align:center\">SolarWatch を準備しています…</div>','boot shield');",
      "  userReplace(\"  const READY_WINDOW_MS = 2500, READY_HOLD_MS = 800;\\n  const READY_HEADING_SD_MAX = 5, READY_ROT_MAX = 20;\",\"  const READY_WINDOW_MS = 800, READY_HOLD_MS = 500, READY_MIN_COVERAGE_MS = 350;\\n  const READY_HEADING_SD_MAX = 8, READY_ROT_MAX = 35;\",'user stability thresholds');",
      "  userReplace(\"    const rawReady=state.stableHeading.length>=15 && finite(hs.sd) && hs.sd<=READY_HEADING_SD_MAX && maxRot<=READY_ROT_MAX && finite(state.cameraElevation);\",\"    const coverageMs=state.stableHeading.length>1 ? now-state.stableHeading[0].t : 0;\\n    const rawReady=coverageMs>=READY_MIN_COVERAGE_MS && finite(hs.sd) && hs.sd<=READY_HEADING_SD_MAX && maxRot<=READY_ROT_MAX && finite(state.cameraElevation);\",'time based stability coverage');",
      "  userReplace(\"    else if(rawReady) setStatus('readyStatus','安定性: 安定中 '+(heldMs/1000).toFixed(1)+'/0.8秒','warn');\",\"    else if(rawReady) setStatus('readyStatus','安定性: 安定中 '+(heldMs/1000).toFixed(1)+'/'+(READY_HOLD_MS/1000).toFixed(1)+'秒','warn');\",'stability hold display');",
      "  userReplace(\"    $('recordBtn').disabled=!usable || state.recording;\",\"    if(state.recording){\\n      $('recordBtn').disabled=false;\\n      $('recordBtn').textContent='測定キャンセル';\\n    }else{\\n      $('recordBtn').disabled=!usable || !stab.held;\\n      $('recordBtn').textContent='10秒測定';\\n    }\",'stable record button gate');",
      "  userReplace(\"      :'測定できます。手振れは10秒データから適応的に外れ値を弱めます。';\",\"      :'太陽を照準中央に合わせ、スマホを静止してください。安定すると測定できます。';\",'unstable measurement message');",
      "  userReplace(\"  async function record(){\\n    if(state.recording) return;\",\"  function cancelRecord(){\\n    if(!state.recording) return;\\n    if(state.sampleTimer){ clearInterval(state.sampleTimer); state.sampleTimer=null; }\\n    state.recording=false;\\n    state.samples=[];\\n    state.recordUnstableSince=null;\\n    state.recordAbortReason=null;\\n    state.finishInProgress=false;\\n    window.__solarwatchUserPendingSession=null;\\n    $('recordingBox').classList.add('hidden');\\n    $('resultCard').classList.add('hidden');\\n    $('bar').style.width='0%';\\n    $('recordingText').textContent='0 / 10.0 秒';\\n    $('recordBtn').textContent='10秒測定';\\n    render();\\n  }\\n\\n  async function record(){\\n    if(state.recording){ cancelRecord(); return; }\",'measurement cancel handler');",
      "  userReplace(\"    const stab=state.lastStability||{};\\n    const sensorOk=finite(state.primaryHeading) && finite(state.cameraElevation);\",\"    const stab=state.lastStability||{};\\n    const sensorOk=finite(state.primaryHeading) && finite(state.cameraElevation);\\n    if(!stab.held){ render(); return; }\",'record start stability guard');",
      "  userReplace(\"    state.recordUnstableSince=null; state.recordAbortReason=null; state.finishInProgress=false;\\n    $('recordBtn').disabled=true;\\n    $('recordingBox').classList.remove('hidden');\",\"    state.recordUnstableSince=null; state.recordAbortReason=null; state.finishInProgress=false;\\n    $('recordBtn').disabled=false;\\n    $('recordBtn').textContent='測定キャンセル';\\n    $('recordingBox').classList.remove('hidden');\",'cancel button on record start');",
      "  userReplace(\"    state.recording=false;\\n    const actual=new Date();\",\"    state.recording=false;\\n    $('recordBtn').disabled=true;\\n    $('recordBtn').textContent='計算中…';\\n    const actual=new Date();\",'calculation button lock');",
      "  userReplace(\"  function startGps(){\\n    if(!navigator.geolocation){ setStatus('gpsStatus','GPS: 非対応','bad'); return; }\\n    state.geoWatch=navigator.geolocation.watchPosition\",\"  function startGps(){\\n    if(!navigator.geolocation){ setStatus('gpsStatus','GPS: 非対応','bad'); return; }\\n    if(state.geoWatch!==null){ navigator.geolocation.clearWatch(state.geoWatch); state.geoWatch=null; }\\n    state.geoWatch=navigator.geolocation.watchPosition\",'GPS watch cleanup');",
      "  userReplace(\"      await startCamera();\\n      startGps();\\n      $('startBtn').textContent='取得中';\",\"      await startCamera();\\n      if(!$('cameraStatus').classList.contains('ok')){ $('startBtn').disabled=false; $('startBtn').textContent='カメラを再取得'; return; }\\n      startGps();\\n      $('startBtn').textContent='取得中';\",'camera start guard');",
      "  userReplace(\"    state.latestSession=session;\\n    try{ await saveSession(session); }catch(e){ alert('保存エラー: '+e.message); }\\n    showResult(session); await renderHistory();\\n    $('recordingBox').classList.add('hidden');\\n    state.finishInProgress=false;\\n    render();\",\"    state.latestSession=session;\\n    window.__solarwatchUserPendingSession=session;\\n    showResult(session);\\n    $('recordingBox').classList.add('hidden');\\n    state.finishInProgress=false;\\n    render();\",'pending result flow');",
      "  userReplace('  renderHistory();\\n})();','  // ユーザー版では統合検証用履歴を初期描画しない。\\n})();','hidden history init');",
      "  userReplace('</body>','<script src=\"user-app-v2.js?v=20261028a\"><\\/script>\\n</body>','user app loader');",
      terminal
    ].join('\n');

    code=code.replace(terminal,replacement);
    const runner=document.createElement('script');
    runner.textContent=code;
    document.body.appendChild(runner);
  }catch(e){
    status.className='loading bad';
    status.innerHTML='<div><strong>ユーザー版 読み込みエラー</strong><pre>'+String(e&&e.stack||e)+'</pre></div>';
  }
})();
</script>
</body>
</html>
