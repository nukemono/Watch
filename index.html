<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>太陽ウォッチ プロトタイプ</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin-bottom:16px}h1{font-size:1.45rem;margin:0 0 8px}h2{font-size:1.05rem;margin:0 0 8px}p{color:#555;line-height:1.6}.btn{display:block;text-decoration:none;text-align:center;border-radius:12px;padding:14px;font-weight:700;margin-top:12px}.sensor{background:#087f5b;color:#fff}.app{background:#f59f00;color:#111}.tag{display:inline-block;background:#eef1f4;padding:4px 8px;border-radius:999px;font-size:.75rem;margin-right:4px}</style></head><body><div class="wrap"><div class="card"><h1>☀️ 太陽ウォッチ</h1><p>目的を分けた2種類のプロトタイプです。</p></div><div class="card"><h2>① センサー検証プロトタイプ</h2><p><span class="tag">iPhone / Android比較</span><span class="tag">同期測定</span><span class="tag">CSV</span></p><p>生センサー値、補正候補、手ブレ、端末差、地上/屋上、観測者の高さ、見かけの地平線補正を記録します。</p><a class="btn sensor" href="sensor.html">センサー検証を開く</a></div><div class="card"><h2>② アプリ動作プロトタイプ</h2><p><span class="tag">UI/UX</span><span class="tag">雨天デモ</span><span class="tag">履歴</span></p><p>トップ → 観測 → 計算 → 結果 → 保存 → 履歴まで、完成アプリの操作感を確認します。実センサーがなくても動きます。</p><a class="btn app" href="app.html">アプリ動作を開く</a></div></div></body></html>
