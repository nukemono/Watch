<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>太陽ウォッチ iPhone 屋外統合検証 — WMM適用版</title>
<style>
body{margin:0;background:#f4f5f7;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:640px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dfe3e8;border-radius:16px;padding:16px}.bad{background:#fff0f0;border-color:#e0aaaa}pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="status">iPhone屋外統合検証 WMM適用版を読み込んでいます…</div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  let html=await fetch('iphone-field-base.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('基準コードの取得に失敗: '+r.status);return r.text();});
  const replaceOnce=(from,to,label)=>{if(!html.includes(from))throw new Error('WMMパッチ対象が見つかりません: '+label);html=html.replace(from,to);};

  replaceOnce(
   '<div class="metric"><div class="label">主方位 / iPhone補正後</div><div id="heading" class="value big">--</div></div>',
   '<div class="metric"><div class="label">主方位 / WMM補正後（真北）</div><div id="heading" class="value big">--</div></div>',
   'heading label'
  );

  // 測定者が見る数値は方位・高度だけに絞る。
  // 内部取得・CSV項目は検証継続のため変更しない。
  for(const [from,to,label] of [
   ['<div class="metric"><div class="label">raw webkitCompass</div><div id="rawHeading" class="value">--</div></div>','<div class="metric hidden"><div class="label">raw webkitCompass</div><div id="rawHeading" class="value">--</div></div>','hide raw heading'],
   ['<div class="metric"><div class="label">Compass Accuracy</div><div id="compassAccuracy" class="value">--</div></div>','<div class="metric hidden"><div class="label">Compass Accuracy</div><div id="compassAccuracy" class="value">--</div></div>','hide compass accuracy'],
   ['<div class="metric"><div class="label">beta姿勢角 0–360</div><div id="beta360" class="value">--</div></div>','<div class="metric hidden"><div class="label">beta姿勢角 0–360</div><div id="beta360" class="value">--</div></div>','hide beta'],
   ['<div class="metric"><div class="label">3Dカメラ方位 診断</div><div id="camera3dHeading" class="value">--</div></div>','<div class="metric hidden"><div class="label">3Dカメラ方位 診断</div><div id="camera3dHeading" class="value">--</div></div>','hide 3d heading'],
   ['<div class="metric"><div class="label">GPS精度</div><div id="gpsAccuracy" class="value">--</div></div>','<div class="metric hidden"><div class="label">GPS精度</div><div id="gpsAccuracy" class="value">--</div></div>','hide gps accuracy'],
   ['<div class="metric"><div class="label">回転速度 最大軸</div><div id="rotationRate" class="value">--</div></div>','<div class="metric hidden"><div class="label">回転速度 最大軸</div><div id="rotationRate" class="value">--</div></div>','hide rotation'],
   ['<div class="muted mono" id="sourceText">方位ソース: --</div>','<div class="muted mono hidden" id="sourceText">方位ソース: --</div>','hide source'],
   ['<div id="flipText" class="muted mono">180°補正: --</div>','<div id="flipText" class="muted mono hidden">180°補正: --</div>','hide flip']
  ]) replaceOnce(from,to,label);

  replaceOnce(
   '\n<script>\n(() => {',
   '\n<script src="wmm.js"><\/script>\n<script>\n(() => {',
   'WMM loader'
  );

  replaceOnce(
   'camera3d:null, primaryHeading:null, cameraElevation:null,',
   "camera3d:null, baseHeading:null, primaryHeading:null, wmmDeclination:null, wmmModel:'', cameraElevation:null,",
   'state WMM fields'
  );

  replaceOnce(
`  function correctedIphoneHeading(){
    if(!finite(state.iosHeading)) return null;
    return norm(state.iosHeading + (state.flip.active ? 180 : 0) + screenDeg());
  }
`,
`  function correctedIphoneHeading(){
    if(!finite(state.iosHeading)) return null;
    return norm(state.iosHeading + (state.flip.active ? 180 : 0) + screenDeg());
  }

  function currentWmmResult(){
    if(!window.WMM2025||!WMM2025.loaded||!state.location) return null;
    const loc=state.location;
    if(!finite(loc.lat)||!finite(loc.lon)) return null;
    try{
      return WMM2025.calculate(loc.lat,loc.lon,finite(loc.altitude)?loc.altitude:0,new Date());
    }catch(e){
      return null;
    }
  }
`,
   'WMM calculation helper'
  );

  replaceOnce(
`    state.camera3d=cameraVectorFromOrientation(state.a,state.b,state.g);
    state.primaryHeading=correctedIphoneHeading();
    state.cameraElevation=normalElevationFromBeta();`,
`    state.camera3d=cameraVectorFromOrientation(state.a,state.b,state.g);
    state.baseHeading=correctedIphoneHeading();
    const wmm=currentWmmResult();
    state.wmmDeclination=wmm&&finite(wmm.declination)?wmm.declination:null;
    state.wmmModel=wmm?.model||'';
    state.primaryHeading=finite(state.baseHeading)&&finite(state.wmmDeclination)?norm(state.baseHeading+state.wmmDeclination):null;
    state.cameraElevation=normalElevationFromBeta();`,
   'primary heading WMM application'
  );

  replaceOnce(
   "    $('sourceText').textContent='方位ソース: webkitCompassHeading + 180°ジャンプ/parity補正';",
   "    $('sourceText').textContent=finite(state.wmmDeclination)?`方位ソース: iPhone補正後 ${fmt(state.baseHeading)} + WMM偏角 ${(state.wmmDeclination>=0?'+':'')+state.wmmDeclination.toFixed(2)}° → 真方位 ${fmt(state.primaryHeading)}`:'方位ソース: WMM2025 / GPS位置・係数読込待ち';",
   'source text'
  );

  replaceOnce(
   "    $('gateText').textContent=!state.location?'GPS待機中':!sensorOk?'方位・高度角の取得待ち':stab.held?'測定できます。安定性は良好です。':'測定できます。安定性は参考表示なので、そのまま測定して構いません。';",
   "    $('gateText').textContent=!state.location?'GPS待機中':!finite(state.wmmDeclination)?'WMM2025偏角の計算待ち':!sensorOk?'方位・高度角の取得待ち':stab.held?'測定できます。WMM補正後方位を使用します。':'測定できます。WMM補正後方位を使用し、安定性は参考表示です。';",
   'measurement gate WMM text'
  );

  replaceOnce(
   '      ios_heading_corrected_deg:state.primaryHeading,',
`      ios_heading_corrected_before_wmm_deg:state.baseHeading,
      wmm_declination_deg:state.wmmDeclination,
      wmm_model:state.wmmModel,
      ios_heading_corrected_deg:state.primaryHeading,`,
   'sample WMM fields'
  );

  replaceOnce(
   '  renderHistory();\n})();',
   "  if(window.WMM2025&&WMM2025.ready){WMM2025.ready.then(()=>render()).catch(()=>render());}\n  renderHistory();\n})();",
   'WMM ready rerender'
  );

  html=html.replace(
   'iPhone向けの180°ジャンプ補正・parity recovery・50ms固定サンプリング・IndexedDB保存に加え、<strong>測定前の安定待ちと測定中の品質監視</strong>を統合しています。',
   'iPhone向けの180°ジャンプ補正・parity recovery・50ms固定サンプリング・IndexedDB保存に加え、<strong>WMM2025磁気偏角補正を主方位へ標準適用</strong>しています。太陽照準表示・10秒記録・時刻推定は同じWMM補正後方位を使用します。'
  );

  document.open();document.write(html);document.close();
 }catch(e){status.className='card bad';status.innerHTML='<strong>WMM適用版 読み込みエラー</strong><pre>'+String(e&&e.stack||e)+'</pre>';}
})();
</script>
</body>
</html>
